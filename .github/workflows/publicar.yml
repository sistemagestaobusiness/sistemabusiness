# Publica o site no GitHub Pages a cada envio para a main (o Alexandre autoriza cada envio).
# Usa só as variáveis públicas SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY (Settings > Secrets and variables > Actions > Variables).
# A versão nova aparece sozinha nas telas abertas (aviso de versão nova, src/lib/versao.ts).
name: Publicar o site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "Faltam as variáveis SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
