# Todo dia: um acesso ao Supabase para o plano grátis não pausar o projeto
# (ele pausa depois de 7 dias sem uso, e o sistema às vezes fica 30 dias sem acesso).
# Usa só as variáveis públicas SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY (Settings > Secrets and variables > Actions > Variables).
# A consulta chega ao banco e é recusada pelas regras de acesso (sem login não se vê nada): é o esperado.
# Se o Supabase não responder, a rotina falha e o GitHub manda e-mail.
name: Manter o Supabase ativo
on:
  schedule:
    - cron: '17 9 * * *'   # 06:17 em Brasília
  workflow_dispatch:
jobs:
  ativo:
    runs-on: ubuntu-24.04
    steps:
      - name: Acesso à API e ao banco
        run: |
          set -u
          c=$(curl -sS -o /dev/null -w "%{http_code}" "${{ vars.SUPABASE_URL }}/rest/v1/categorias?select=id&limit=1" \
                -H "apikey: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}")
          echo "Supabase respondeu $c"
          case "$c" in 2*|401|403) exit 0 ;; *) echo "::error::Supabase não respondeu como esperado ($c)"; exit 1 ;; esac
